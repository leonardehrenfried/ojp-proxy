micronaut.application.name=ojp-proxy
micronaut.server.port=8080
micronaut.http.services.pelias.url=${PELIAS_URL:`https://geocoder.otp.opendatahub.testingmachine.eu`}
micronaut.http.services.otp.url=${OTP_OJP_URL:`https://otp.opendatahub.testingmachine.eu/otp/ojp/v2/`}
# trip planning can take longer than the default 10s
micronaut.http.services.otp.read-timeout=60s
